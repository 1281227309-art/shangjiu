name: contributors

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'   # 每日 0 点（UTC）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要完整历史以统计 commit

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 生成贡献者统计
        run: node scripts/contributors.mjs

      - name: 提交 contributors.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contributors.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新贡献者统计 contributors.json"
            git push
          fi
